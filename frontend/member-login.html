<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>會員登入｜走部落 TribeWalk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="images/brand/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="member-login">

<header class="navbar">
  <a href="index.html" class="brand"><img src="images/brand/logo.png" alt="走部落 TribeWalk" class="brand-logo">走部落 <span>TribeWalk</span></a>
</header>

<main class="container" style="max-width:420px;">
  <h2>會員登入</h2>
  <div class="form-panel">
    <div id="alert-box"></div>
    <form id="login-form">
      <div class="form-row">
        <label for="account">帳號或 Email</label>
        <input type="text" id="account" autocomplete="username">
      </div>
      <div class="form-row">
        <label for="password">密碼</label>
        <input type="password" id="password" autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">登入</button>
    </form>
    <p style="font-size:0.9rem;margin-top:14px;">
      還沒有帳號嗎？<a href="member-register.html">立即註冊</a>
    </p>
  </div>
</main>

<footer class="wavy-footer">
  <svg class="wave-shape" viewBox="0 0 1200 60" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0,45 L90,18 L180,40 L280,8 L360,32 L460,42 L560,14 L650,38 L760,10 L860,36 L960,20 L1060,40 L1200,15 L1200,60 L0,60 Z" fill="#2FB6A8"/>
  </svg>
  <div class="wavy-footer-inner">
    <nav class="footer-sitemap">
      <a href="index.html">首頁</a>
      <a href="attractions.html">景點列表</a>
      <a href="itineraries.html">完整遊程</a>
      <a href="groups.html">揪團</a>
      <a href="about.html">關於我們</a>
      <a href="member-login.html">會員登入</a>
      <a href="member-register.html">會員註冊</a>
      <a href="admin.html">管理後台</a>
    </nav>
    <div class="wavy-footer-deco">🏔️ 🌲 ☁️ 🌲 🏔️</div>
    <p>AI輔助全端程式設計與專案實作班 — 專題實作：AI 輔助部落文化旅遊推薦平台（走部落 TribeWalk）</p>
  </div>
</footer>

<script src="js/main.js"></script>
<script src="js/api.js"></script>
<script>
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const account = document.getElementById('account').value.trim();
  const password = document.getElementById('password').value;
  const alertBox = document.getElementById('alert-box');
  try {
    await Api.memberLogin(account, password);
    location.href = 'index.html';
  } catch (err) {
    alertBox.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
  }
});
</script>
</body>
</html>
